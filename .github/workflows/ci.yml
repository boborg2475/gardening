name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit -- --coverage
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - run: npm run build

      - name: Post coverage report to PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  mutation-testing:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci
      - run: npm run test:mutate

      - name: Post mutation report to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/mutation/mutation-report.json';

            if (!fs.existsSync(path)) {
              console.log('No mutation report found — skipping comment.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const files = report.files || {};

            let totalKilled = 0, totalSurvived = 0, totalTimeout = 0, totalNoCov = 0;
            const rows = [];

            for (const [filePath, data] of Object.entries(files)) {
              const mutants = data.mutants || [];
              const killed = mutants.filter(m => m.status === 'Killed').length;
              const survived = mutants.filter(m => m.status === 'Survived').length;
              const timeout = mutants.filter(m => m.status === 'Timeout').length;
              const noCov = mutants.filter(m => m.status === 'NoCoverage').length;
              const total = killed + survived + timeout + noCov;
              const score = total > 0 ? ((killed + timeout) / total * 100).toFixed(1) : '—';

              totalKilled += killed;
              totalSurvived += survived;
              totalTimeout += timeout;
              totalNoCov += noCov;

              const shortPath = filePath.replace(/^src\/lib\//, '');
              rows.push(`| \`${shortPath}\` | ${score}% | ${killed} | ${survived} | ${total} |`);
            }

            const grandTotal = totalKilled + totalSurvived + totalTimeout + totalNoCov;
            const overallScore = grandTotal > 0
              ? ((totalKilled + totalTimeout) / grandTotal * 100).toFixed(1)
              : '—';

            const body = [
              '## 🧬 Mutation Testing Report',
              '',
              `**Overall Score: ${overallScore}%** — ${totalKilled} killed, ${totalSurvived} survived out of ${grandTotal} mutants`,
              '',
              '| File | Score | Killed | Survived | Total |',
              '|------|------:|-------:|---------:|------:|',
              ...rows,
              '',
              `> Threshold: break at <50%, low at <60%, high at ≥80%`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🧬 Mutation Testing Report';
            const existing = comments.find(c => c.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
